[project]
name = "telco-kpi-mlops-platform"
version = "0.1.0"
description = "Production-style telecom KPI forecasting and anomaly detection service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "mlflow>=2.17",
    "numpy>=2.1",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "ipykernel>=6.29",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
